<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridiron Oracle</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>🏈 Superbowl LX
        </h1>
        {{if .User}}
            <div style="text-align: center; margin-bottom: 20px;">
                Playing as: <strong>{{.User.Username}}</strong> 
                <span style="margin-left: 10px;">Score: {{.User.TotalScore}}</span>
                <a href="/logout" style="margin-left: 10px; font-size: 0.8rem;">(Change User)</a>
            </div>
        {{end}}
    </header>

    {{if not .User}}
    <div class="login-container">
        <h2>Join the Party</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Your Name" required autocomplete="off">
            <input type="password" name="pin" placeholder="PIN (Optional, 4 digits)" maxlength="4" pattern="\d{4}">
            <br>
            <button type="submit" class="login-btn">Enter Arena</button>
        </form>
    </div>
    {{end}}

    {{if .User}}
    <div class="grid-container">
        {{range .Questions}}
        <div class="question-card">
            <span class="category-badge">{{.Category}}</span>
            <div class="question-text">{{.Text}}</div>
            
            <div class="options-container">
                {{$qID := .ID}}
                {{range .Options}}
                <label class="option-label">
                    <input type="radio" 
                           name="q-{{$qID}}" 
                           value="{{.ID}}" 
                           onchange="savePrediction({{$qID}}, {{.ID}})"
                           {{if .IsSelected}}checked{{end}}
                    >
                    <style>
                        input[value="{{.ID}}"]:checked + .option-box {
                            background-color: {{.ColorHex}} !important;
                        }
                    </style>
                    <div class="option-box">
                        {{.Text}}
                    </div>
                </label>
                {{end}}
            </div>
        </div>
        {{end}}
    </div>

    <div id="save-status" style="position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px; border-radius: 5px; opacity: 0; transition: opacity 0.5s;">
        Saved
    </div>

    <script>
        function savePrediction(questionId, optionId) {
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_id: questionId, option_id: optionId })
            })
            .then(response => {
                if (response.ok) showToast();
            })
            .catch(err => console.error('Error saving:', err));
        }

        function showToast() {
            const el = document.getElementById('save-status');
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 1000);
        }
    </script>
    {{end}}

</body>
</html>
