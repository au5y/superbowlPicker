<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <style>
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .leaderboard-table th { text-align: left; padding: 15px; border-bottom: 2px solid var(--border-color); color: var(--subtext-color); font-size: 0.9rem; text-transform: uppercase; }
        .leaderboard-table td { padding: 15px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        
        /* Rank Column */
        .rank-col { font-weight: bold; font-size: 1.5rem; color: var(--subtext-color); width: 50px; text-align: center; }
        .rank-1 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); font-size: 2rem; }
        .rank-2 { color: #C0C0C0; font-size: 1.8rem; }
        .rank-3 { color: #CD7F32; font-size: 1.7rem; }

        /* User Column */
        .user-cell { display: flex; align-items: center; gap: 15px; }
        .lb-avatar { 
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--border-color); 
            display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 1.8rem; 
            background: var(--input-bg);
        }
        .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* IMPROVED VISIBILITY */
        .lb-name { 
            font-size: 1.3rem; 
            font-weight: 700; 
            text-shadow: 0 1px 1px rgba(0,0,0,0.2); /* Subtle shadow for contrast */
        }
        
        /* Score Column */
        .score-cell { font-size: 1.8rem; font-weight: bold; color: var(--text-color); text-align: right; }

        /* Config Panel */
        .config-panel {
            background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px;
            border: 1px solid var(--border-color); display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        }
        .config-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; user-select: none; }
        .cat-col-header { text-align: center !important; font-size: 0.7rem !important; }
        .cat-col-cell { text-align: center; font-weight: bold; color: var(--subtext-color); font-size: 1.1rem; }
    </style>
</head>
<body>
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
    </script>

    {{template "drawer" .}}

    <div style="max-width: 1000px; margin: 0 auto; padding-top: 60px;">
        <h1 style="text-align: center; margin-bottom: 20px;">🏆 Leaderboard</h1>

        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
            <button class="filter-btn active" id="btn-global" onclick="setScope('global')">Global</button>
            {{if ne .User.RoomCode ""}}
                {{$aliases := .RoomAliases}}
                {{range split .User.RoomCode ","}}
                    <button class="filter-btn" onclick="setScope('{{.}}')">{{roomName . $aliases}}</button>
                {{end}}
            {{end}}
        </div>

        <details>
            <summary style="cursor: pointer; color: var(--subtext-color); margin-bottom: 10px; font-weight: bold;">⚙️ Configure Columns</summary>
            <div class="config-panel" id="column-toggles">
                </div>
        </details>

        <div style="background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 10px var(--shadow-color); overflow: hidden;">
            <table class="leaderboard-table">
                <thead>
                    <tr id="table-header">
                        <th>#</th>
                        <th>Player</th>
                        <th style="text-align: right;">Score</th>
                    </tr>
                </thead>
                <tbody id="lb-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentScope = "global";
        let allCategories = new Set();
        let activeCategories = new Set(); // Stores which columns are visible

        function setScope(scope) {
            currentScope = scope;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadLeaderboard();
        }

        function toggleCategory(cat) {
            if (activeCategories.has(cat)) {
                activeCategories.delete(cat);
            } else {
                activeCategories.add(cat);
            }
            renderTable(window.lastData); // Re-render with cached data
        }

        function loadLeaderboard() {
            const url = currentScope === 'global' ? '/api/leaderboard?scope=global' : '/api/leaderboard?room=' + currentScope;
            
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    window.lastData = data; // Cache data
                    
                    // 1. Discover all categories from data
                    data.forEach(user => {
                        if (user.category_scores) {
                            Object.keys(user.category_scores).forEach(c => allCategories.add(c));
                        }
                    });

                    // 2. Render Checkboxes (only once or update if new cats appear)
                    renderToggles();

                    // 3. Render Table
                    renderTable(data);
                });
        }

        function renderToggles() {
            const container = document.getElementById('column-toggles');
            container.innerHTML = '';
            
            // Add "Select All" / Clear logic if desired, but simple toggles for now
            Array.from(allCategories).sort().forEach(cat => {
                const label = document.createElement('label');
                label.className = 'config-toggle';
                
                const box = document.createElement('input');
                box.type = 'checkbox';
                box.checked = activeCategories.has(cat);
                box.onchange = () => toggleCategory(cat);
                
                label.appendChild(box);
                label.appendChild(document.createTextNode(cat));
                container.appendChild(label);
            });
            
            if (allCategories.size === 0) {
                container.innerHTML = '<span style="color:var(--subtext-color)">No category data available yet.</span>';
            }
        }

        function renderTable(data) {
            // 1. Setup Header
            const headerRow = document.getElementById('table-header');
            
            // Clear existing dynamic columns (keep #, Player)
            // We want structure: [#] [Player] [TB] [Cat1] [Cat2]... [Score]
            // Reset to base
            headerRow.innerHTML = '<th>#</th><th>Player</th><th style="text-align:center; color:var(--subtext-color); font-size:0.9rem;">TB</th><th style="text-align: right;">Score</th>';
            
            // Insert Active Category Headers BEFORE the Score column
            const sortedCats = Array.from(activeCategories).sort();
            const scoreHeader = headerRow.lastElementChild; // "Score" column
            
            sortedCats.forEach(cat => {
                const th = document.createElement('th');
                th.textContent = cat;
                th.className = 'cat-col-header';
                headerRow.insertBefore(th, scoreHeader);
            });

            // 2. Render Body
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';

            let rank = 1;
            for (let i = 0; i < data.length; i++) {
                const user = data[i];
                // Only increment rank if Score matches. 
                // Note: With complex tie-breakers, unique ranks are common. 
                // If you want strictly "Score" based rank sharing, keep this. 
                // If you want the tie-breaker to decide rank, use just "i + 1"
                if (i > 0 && user.total_score < data[i-1].total_score) {
                    rank = i + 1;
                }
                // If using full tie breaker logic for rank:
                // rank = i + 1; 

                const tr = document.createElement('tr');
                tr.onclick = () => window.location.href = `/user/${user.id}`;
                tr.style.cursor = 'pointer';

                // Rank
                const rankTd = document.createElement('td');
                rankTd.className = `rank-col rank-${rank}`;
                rankTd.textContent = rank; // or i+1
                tr.appendChild(rankTd);

                // Player
                const playerTd = document.createElement('td');
                playerTd.innerHTML = `
                    <div class="user-cell">
                        <div class="lb-avatar" style="border-color: ${user.color_hex || '#ccc'}">
                            ${user.icon && user.icon.length > 15 ? `<img src="${user.icon}">` : user.icon}
                        </div>
                        <div class="lb-name" style="color: ${user.color_hex || 'inherit'}">${user.username}</div>
                    </div>
                `;
                tr.appendChild(playerTd);

                // TB Column (New)
                const tbTd = document.createElement('td');
                tbTd.style.textAlign = 'center';
                tbTd.style.fontWeight = 'bold';
                tbTd.style.color = 'var(--subtext-color)';
                tbTd.textContent = user.tie_breaker || '-';
                tr.appendChild(tbTd);

                // Dynamic Category Scores
                sortedCats.forEach(cat => {
                    const catTd = document.createElement('td');
                    catTd.className = 'cat-col-cell';
                    const s = user.category_scores ? (user.category_scores[cat] || 0) : 0;
                    catTd.textContent = s > 0 ? s : '-';
                    tr.appendChild(catTd);
                });

                // Total Score
                const scoreTd = document.createElement('td');
                scoreTd.className = 'score-cell';
                scoreTd.textContent = user.total_score;
                tr.appendChild(scoreTd);

                tbody.appendChild(tr);
            }
        }
        // Initialize
        loadLeaderboard();
        // Auto-refresh every 10s
        setInterval(loadLeaderboard, 10000);
    </script>

    <style>
        .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; color: var(--text-color); font-weight: 600; }
        .filter-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    </style>
</body>
</html>
