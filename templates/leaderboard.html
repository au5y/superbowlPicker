<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Shared Drawer Styles */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; display: none; }
        .drawer-overlay.open { display: block; }
        .drawer { position: fixed; top: 0; left: 0; width: 280px; height: 100%; background: var(--drawer-bg); z-index: 1000; transition: transform 0.3s ease; box-shadow: 2px 0 10px var(--shadow-color); padding-top: 20px; transform: translateX(-100%); }
        .drawer.open { transform: translateX(0); }
        .drawer-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-size: 1.2rem; font-weight: bold; color: var(--heading-color); display: flex; justify-content: space-between; align-items: center; }
        .drawer-nav a, .drawer-nav button.theme-toggle { display: block; padding: 15px 20px; width: 100%; text-align: left; box-sizing: border-box; color: var(--text-color); text-decoration: none; border-bottom: 1px solid var(--hover-bg); background: none; border: none; font-size: 1rem; cursor: pointer; }
        .drawer-nav a:hover, .drawer-nav button:hover { background: var(--hover-bg); }
        
        .fixed-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1100; background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 2px 5px var(--shadow-color); color: var(--text-color); }

        /* Leaderboard Specifics */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th { background: var(--hover-bg); padding: 15px; text-align: left; color: var(--heading-color); }
        td { padding: 15px; border-bottom: 1px solid var(--border-color); color: var(--text-color); }
        tr:hover { background: var(--hover-bg); cursor: pointer; }
        .score-cell { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }
        .rank-cell { font-weight: bold; color: var(--subtext-color); width: 50px; }
        .scope-btn { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; margin-right: 5px; font-weight: bold; transition: all 0.2s; }
        .scope-btn.active { background: var(--nav-active-bg); color: var(--nav-active-text); }
        .scope-btn.inactive { background: var(--hover-bg); color: var(--text-color); font-weight: normal; }
    </style>
</head>
<body>
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
    </script>

    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <button class="fixed-menu-btn" onclick="toggleDrawer()">☰</button>

    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <span>Menu</span>
            <button onclick="toggleDrawer()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-color);">&times;</button>
        </div>
        <div class="drawer-nav">
            <a href="/">🏈 My Picks</a>
            <a href="/leaderboard">🏆 Leaderboard</a>
            <a href="/user/{{.User.ID}}">👤 My Profile</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌗 Toggle Dark Mode</button>
            <hr style="border:0; border-top:1px solid var(--border-color);">
            <a href="/logout" style="color: #C60C30;">Log Out</a>
        </div>
    </div>

    <div style="max-width: 800px; margin: 0 auto; padding-top: 60px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap: wrap; gap: 10px;">
            <h2 style="margin:0;">🏆 Live Standings</h2>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="room-controls">
                    </div>
            </div>
        </div>

        <div class="table-container">
            <table id="lb-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">#</th>
                        <th>Player</th>
                        <th>Tie Breaker</th>
                        <th style="text-align: right;">Score</th>
                    </tr>
                </thead>
                <tbody id="lb-body">
                    <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Go template injection
        const rawRoomStr = "{{.User.RoomCode}}";
        const userRooms = rawRoomStr.split(',').filter(r => r.trim() !== "");
        
        let currentRoom = userRooms.length > 0 ? userRooms[0] : "MAIN";
        let isGlobal = false;

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            if (drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                drawer.classList.add('open');
                overlay.classList.add('open');
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function initControls() {
            const container = document.getElementById('room-controls');
            container.innerHTML = '';

            // Room Buttons
            userRooms.forEach(room => {
                const btn = document.createElement('button');
                btn.className = (room === currentRoom && !isGlobal) ? 'scope-btn active' : 'scope-btn inactive';
                btn.textContent = room;
                btn.onclick = () => setScope(room, false);
                container.appendChild(btn);
            });

            // Global Button
            const globalBtn = document.createElement('button');
            globalBtn.className = isGlobal ? 'scope-btn active' : 'scope-btn inactive';
            globalBtn.textContent = 'Global';
            globalBtn.onclick = () => setScope(null, true);
            container.appendChild(globalBtn);
        }

        function setScope(room, global) {
            isGlobal = global;
            if (room) currentRoom = room;

            initControls();
            loadLeaderboard();
        }

        function loadLeaderboard() {
            let url = '/api/leaderboard';
            
            if (isGlobal) {
                url += '?scope=global';
            } else {
                url += '?room=' + encodeURIComponent(currentRoom);
            }

            fetch(url)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('lb-body');
                tbody.innerHTML = '';
                
                if (!data || data.length === 0) {
                     tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">No players found.</td></tr>';
                     return;
                }

                data.forEach((user, index) => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => window.location.href = '/user/' + user.id;
                    
                    const tdRank = document.createElement('td');
                    tdRank.className = 'rank-cell';
                    tdRank.textContent = index + 1;
                    tr.appendChild(tdRank);

                    const tdPlayer = document.createElement('td');
                    const strong = document.createElement('strong');
                    strong.textContent = user.username;
                    tdPlayer.appendChild(strong);

                    tr.appendChild(tdPlayer);

                    const tdTie = document.createElement('td');
                    tdTie.style.color = 'var(--subtext-color)';
                    tdTie.textContent = user.tie_breaker;
                    tr.appendChild(tdTie);

                    const tdScore = document.createElement('td');
                    tdScore.className = 'score-cell';
                    tdScore.style.textAlign = 'right';
                    tdScore.textContent = user.total_score;
                    tr.appendChild(tdScore);

                    tbody.appendChild(tr);
                });
            });
        }

        // Initialize
        initControls();
        loadLeaderboard();
        setInterval(loadLeaderboard, 5000);
    </script>
</body>
</html>
