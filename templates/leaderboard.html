<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .nav-bar { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-item { color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; }
        .nav-item:hover { background: #555; }
        .nav-item.active { background: #002244; border: 1px solid #69BE28; }
        
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #f4f4f4; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; cursor: pointer; }
        .score-cell { font-size: 1.2rem; font-weight: bold; color: #002244; }
        .rank-cell { font-weight: bold; color: #888; width: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>🏈 Superbowl LX Prop Pool</h1>
        <div class="nav-bar">
            <a href="/" class="nav-item">My Picks</a>
            <a href="/leaderboard" class="nav-item active">Leaderboard</a>
        </div>
    </header>

    <div style="max-width: 800px; margin: 0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="margin:0;">🏆 Live Standings</h2>
            <div>
                <button id="btn-room" onclick="setScope('room')" style="padding:8px 12px; font-weight:bold; cursor:pointer; background:#002244; color:white; border:none; border-radius:4px;">My Room [{{.User.RoomCode}}]</button>
                <button id="btn-global" onclick="setScope('global')" style="padding:8px 12px; cursor:pointer; background:#eee; color:#333; border:none; border-radius:4px;">Global</button>
            </div>
        </div>
        
        <div class="table-container">
            <table id="lb-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Player</th>
                        <th>Tie Breaker (Points)</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="lb-body">
                    <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const userRoom = "{{.User.RoomCode}}";
        let currentScope = 'room';

        function setScope(scope) {
            currentScope = scope;

            const btnRoom = document.getElementById('btn-room');
            const btnGlobal = document.getElementById('btn-global');

            if (scope === 'room') {
                btnRoom.style.background = '#002244';
                btnRoom.style.color = 'white';
                btnRoom.style.fontWeight = 'bold';

                btnGlobal.style.background = '#eee';
                btnGlobal.style.color = '#333';
                btnGlobal.style.fontWeight = 'normal';
            } else {
                btnGlobal.style.background = '#002244';
                btnGlobal.style.color = 'white';
                btnGlobal.style.fontWeight = 'bold';

                btnRoom.style.background = '#eee';
                btnRoom.style.color = '#333';
                btnRoom.style.fontWeight = 'normal';
            }
            loadLeaderboard();
        }

        function loadLeaderboard() {
            let url = '/api/leaderboard';
            if (currentScope === 'room') {
                url += '?room=' + encodeURIComponent(userRoom);
            } else {
                url += '?scope=global';
            }

            fetch(url)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('lb-body');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                     tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">No players in this room yet.</td></tr>';
                     return;
                }

                data.forEach((user, index) => {
                    const tr = document.createElement('tr');
                    // Click to view profile
                    tr.onclick = () => window.location.href = '/user/' + user.id;
                    
                    // Rank
                    const tdRank = document.createElement('td');
                    tdRank.className = 'rank-cell';
                    tdRank.textContent = index + 1;
                    tr.appendChild(tdRank);

                    // Player
                    const tdPlayer = document.createElement('td');
                    const strong = document.createElement('strong');
                    strong.textContent = user.username;
                    tdPlayer.appendChild(strong);

                    if (currentScope === 'global') {
                        const span = document.createElement('span');
                        span.style.fontSize = '0.8rem';
                        span.style.color = '#666';
                        span.style.marginLeft = '5px';
                        span.textContent = '[' + user.room_code + ']';
                        tdPlayer.appendChild(span);
                    }
                    tr.appendChild(tdPlayer);

                    // Tie Breaker
                    const tdTie = document.createElement('td');
                    tdTie.style.color = '#666';
                    tdTie.textContent = user.tie_breaker;
                    tr.appendChild(tdTie);

                    // Score
                    const tdScore = document.createElement('td');
                    tdScore.className = 'score-cell';
                    tdScore.textContent = user.total_score;
                    tr.appendChild(tdScore);

                    tbody.appendChild(tr);
                });
            });
        }

        // Load immediately, then every 5 seconds
        loadLeaderboard();
        setInterval(loadLeaderboard, 5000);
    </script>
</body>
</html>
